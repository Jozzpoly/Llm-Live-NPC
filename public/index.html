<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM Live NPC Lab</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #0f1115; color: #f4f6f8; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { width: min(760px, calc(100vw - 40px)); padding: 32px; border: 1px solid #30343b; border-radius: 18px; background: #171a20; }
    h1 { margin: 0 0 8px; font-size: clamp(28px, 5vw, 44px); }
    p { color: #b7bec8; line-height: 1.55; }
    .status { display: grid; gap: 10px; margin: 24px 0; }
    .row { display: flex; justify-content: space-between; gap: 24px; padding: 12px 14px; background: #101318; border-radius: 10px; }
    button { border: 0; border-radius: 10px; padding: 12px 16px; font: inherit; cursor: pointer; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; padding: 14px; background: #0c0e12; border-radius: 10px; min-height: 72px; }
    small { color: #858d98; }
  </style>
</head>
<body>
  <main>
    <h1>LLM Live NPC</h1>
    <p>Infrastructure bootstrap. No game architecture has been committed yet.</p>

    <section class="status">
      <div class="row"><span>Cloudflare Worker</span><strong id="worker">checking…</strong></div>
      <div class="row"><span>Workers AI binding</span><strong id="ai">checking…</strong></div>
      <div class="row"><span>AI Gateway</span><strong id="gateway">checking…</strong></div>
    </section>

    <button id="smoke">Run bounded AI smoke</button>
    <pre id="output">Waiting.</pre>
    <small>The smoke endpoint is temporary infrastructure evidence, not the NPC cognition loop.</small>
  </main>

  <script type="module">
    const worker = document.querySelector('#worker');
    const ai = document.querySelector('#ai');
    const gateway = document.querySelector('#gateway');
    const output = document.querySelector('#output');
    const smoke = document.querySelector('#smoke');

    async function health() {
      try {
        const response = await fetch('/api/health', { cache: 'no-store' });
        const data = await response.json();
        worker.textContent = data.ok ? 'online' : 'error';
        ai.textContent = data.aiBinding ? 'bound' : 'missing';
        gateway.textContent = data.gateway ?? 'unknown';
      } catch (error) {
        worker.textContent = 'offline';
        ai.textContent = 'unknown';
        gateway.textContent = 'unknown';
        output.textContent = String(error);
      }
    }

    smoke.addEventListener('click', async () => {
      smoke.disabled = true;
      output.textContent = 'Calling Workers AI through AI Gateway…';
      try {
        const response = await fetch('/api/ai/smoke', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({})
        });
        const data = await response.json();
        output.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        output.textContent = String(error);
      } finally {
        smoke.disabled = false;
      }
    });

    health();
  </script>
</body>
</html>
