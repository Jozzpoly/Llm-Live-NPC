name: Browser Evidence

on:
  pull_request:
    paths:
      - "src/**"
      - "worker/**"
      - "scripts/spc-browser-evidence.mjs"
      - "scripts/spc-browser-manual-control-evidence.mjs"
      - "scripts/spc-browser-missing-crate-evidence.mjs"
      - "scripts/spc-browser-missing-crate-recovery-evidence.mjs"
      - "scripts/spc-browser-missing-crate-interruption-evidence.mjs"
      - "scripts/spc-browser-ida-message-delivery-evidence.mjs"
      - "scripts/spc-browser-zero-provider-local-life-evidence.mjs"
      - "scripts/analyze-spc-browser-evidence.mjs"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/browser-evidence.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  spc-browser-evidence:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build browser candidate
        run: npm run build

      - name: Locate runner Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version

      - name: Start static built-client server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist/client > /tmp/spc-static.log 2>&1 &
          echo $! > /tmp/spc-static.pid
          for attempt in $(seq 1 80); do
            if curl --fail --silent --show-error 'http://127.0.0.1:4173/?spc=1' > /dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/spc-static.log
          exit 1

      - name: Collect SPC browser evidence
        env:
          EVIDENCE_BASE_URL: http://127.0.0.1:4173
          EVIDENCE_OUTPUT_DIR: evidence/browser
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/spc-browser-evidence.mjs

      - name: Analyze browser evidence
        if: success()
        env:
          EVIDENCE_OUTPUT_DIR: evidence/browser
        run: node scripts/analyze-spc-browser-evidence.mjs

      - name: Qualify manual World control
        if: success()
        env:
          EVIDENCE_BASE_URL: http://127.0.0.1:4173
          MANUAL_CONTROL_OUTPUT: evidence/browser/manual-control.json
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/spc-browser-manual-control-evidence.mjs

      - name: Qualify missing-crate epistemic boundary
        if: success()
        env:
          EVIDENCE_BASE_URL: http://127.0.0.1:4173
          MISSING_CRATE_OUTPUT: evidence/browser/missing-crate.json
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/spc-browser-missing-crate-evidence.mjs

      - name: Qualify missing-crate embodied recovery
        if: success()
        env:
          EVIDENCE_BASE_URL: http://127.0.0.1:4173
          MISSING_CRATE_RECOVERY_OUTPUT: evidence/browser/missing-crate-recovery.json
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/spc-browser-missing-crate-recovery-evidence.mjs

      - name: Qualify player-addressed interruption and exact return
        if: success()
        env:
          EVIDENCE_BASE_URL: http://127.0.0.1:4173
          MISSING_CRATE_INTERRUPTION_OUTPUT: evidence/browser/missing-crate-interruption.json
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/spc-browser-missing-crate-interruption-evidence.mjs

      - name: Qualify Ida social delivery causal and private-hearing join
        if: success()
        env:
          EVIDENCE_BASE_URL: http://127.0.0.1:4173
          IDA_MESSAGE_OUTPUT: evidence/browser/ida-message-delivery.json
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/spc-browser-ida-message-delivery-evidence.mjs

      - name: Qualify zero-provider local life in real Chromium
        if: success()
        env:
          EVIDENCE_BASE_URL: http://127.0.0.1:4173
          ZERO_PROVIDER_LOCAL_LIFE_OUTPUT: evidence/browser/zero-provider-local-life.json
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/spc-browser-zero-provider-local-life-evidence.mjs

      - name: Print evidence summary
        if: always()
        shell: bash
        run: |
          echo "--- Static client server ---"
          cat /tmp/spc-static.log || true
          echo "--- Evidence ---"
          if [ -f evidence/browser/evidence.json ]; then
            node -e 'const r=require("./evidence/browser/evidence.json"); console.log(JSON.stringify({sourceSha:r.sourceSha,outcome:r.outcome,chrome:r.chrome,assertions:r.assertions,checkpoints:r.checkpoints?.map(c=>({name:c.name,tick:c.snapshot?.tick,selected:c.snapshot?.selectedName,worldOnly:c.worldOnly,bytes:c.bytes})),runtimeExceptions:r.runtimeExceptions?.length,logErrors:r.logErrors?.length,networkFailures:r.networkFailures?.length,httpErrors:r.httpErrors?.length},null,2))'
          else
            cat evidence/browser/harness-error.json || true
          fi
          echo "--- Derived analysis ---"
          cat evidence/browser/analysis.md 2>/dev/null || true
          echo "--- Manual World control ---"
          if [ -f evidence/browser/manual-control.json ]; then
            cat evidence/browser/manual-control.json
          else
            echo "manual-control.json missing"
          fi
          echo "--- Missing-crate adversarial evidence ---"
          if [ -f evidence/browser/missing-crate.json ]; then
            cat evidence/browser/missing-crate.json
          else
            echo "missing-crate.json missing"
          fi
          echo "--- Missing-crate embodied recovery evidence ---"
          if [ -f evidence/browser/missing-crate-recovery.json ]; then
            cat evidence/browser/missing-crate-recovery.json
          else
            echo "missing-crate-recovery.json missing"
          fi
          echo "--- Player-addressed interruption and exact return evidence ---"
          if [ -f evidence/browser/missing-crate-interruption.json ]; then
            cat evidence/browser/missing-crate-interruption.json
          else
            echo "missing-crate-interruption.json missing"
          fi
          echo "--- Ida social delivery evidence ---"
          if [ -f evidence/browser/ida-message-delivery.json ]; then
            cat evidence/browser/ida-message-delivery.json
          else
            echo "ida-message-delivery.json missing"
          fi
          echo "--- Zero-provider local-life evidence ---"
          if [ -f evidence/browser/zero-provider-local-life.json ]; then
            cat evidence/browser/zero-provider-local-life.json
          else
            echo "zero-provider-local-life.json missing"
          fi

      - name: Upload browser evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spc-browser-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/browser
          if-no-files-found: error
          retention-days: 14

      - name: Publish latest evidence snapshot
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          PUBLISH_DIR="$(mktemp -d)"
          cp -R evidence/browser/. "$PUBLISH_DIR/"
          printf '%s\n' "$SOURCE_SHA" > "$PUBLISH_DIR/source-sha.txt"
          touch "$PUBLISH_DIR/.nojekyll"
          cd "$PUBLISH_DIR"
          git init
          git checkout -b evidence-snapshot
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "SPC browser evidence for $SOURCE_SHA"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/evidence/spc-browser-latest
