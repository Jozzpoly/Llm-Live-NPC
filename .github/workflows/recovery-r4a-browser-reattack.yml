name: Recovery R4a browser re-attack

on:
  push:
    branches:
      - evidence/recovery-r4a-browser-reattack

permissions:
  contents: read

jobs:
  browser-reattack:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      R4A_PREVIEW_URL: https://evidence-recovery-r4a-browser-reattack-llm-live-npc.jozzpoly.workers.dev
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install branch-only Playwright apparatus
        run: npm install --no-save --package-lock=false --ignore-scripts @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Wait for branch preview
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl -fsS "$R4A_PREVIEW_URL" >/dev/null; then
              echo "Preview reachable on attempt $attempt"
              exit 0
            fi
            sleep 5
          done
          echo "Preview did not become reachable" >&2
          exit 1
      - name: Run rendered R4a re-attack
        run: npx playwright test evidence/recovery-r4a-browser-reattack.spec.ts --reporter=line
