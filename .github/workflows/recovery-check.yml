name: Recovery Check

on:
  push:
    branches:
      - recovery/owner-fail-2026-09-07

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck, all source tests, and Vite build
        run: npm run check

      - name: Verify self-contained preview upload path
        run: npm run deploy:preview -- --dry-run
