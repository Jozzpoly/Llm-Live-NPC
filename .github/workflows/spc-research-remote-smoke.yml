name: SPC Research - public safety smoke (no inference)

on:
  push:
    branches:
      - staging/spc-research-first-luna-20261011

permissions:
  contents: read
  statuses: write

concurrency:
  group: spc-research-remote-smoke
  cancel-in-progress: true

jobs:
  remote-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for independent research Worker health and check fail-closed auth
        shell: bash
        run: |
          set -euo pipefail
          # Workers.dev account suffix was previously observed on the user's
          # older Cloudflare Worker. This candidate must be verified here.
          base="https://llm-live-npc-spc-research.jozzpoly.workers.dev"
          ready=0
          for attempt in $(seq 1 25); do
            status="$(curl --silent --show-error --max-time 8 --output /tmp/spc-research-health.json --write-out '%{http_code}' "$base/api/health" 2>/dev/null || true)"
            if [ "$status" = "200" ] && python3 - /tmp/spc-research-health.json <<'PY'
          import json,sys
          try:
              data=json.load(open(sys.argv[1]))
              assert data.get("providerResearchOperatorGateConfigured") is True
              assert data.get("hearthKeyConfigured") is True
              assert data.get("spcNextLifeIntentModelConfigured") == "gpt-5.6-luna"
          except (OSError, ValueError, AssertionError):
              sys.exit(1)
          PY
            then
              ready=1
              echo "PASS: exact candidate Worker answers health with project key, operator gate and configured GPT-5.6 Luna."
              break
            fi
            # Once the isolated Worker exists, a 200 with missing capability
            # flags is a SPECIFIC missing runtime binding, not a deployment wait.
            # Report only boolean presence, NEVER a credential value.
            if [ "$status" = "200" ]; then
              python3 - /tmp/spc-research-health.json <<'PY'
          import json,sys
          try:
              d=json.load(open(sys.argv[1]))
              print("RESEARCH_RUNTIME_BINDINGS",
                    "operator_gate=" + str(d.get("providerResearchOperatorGateConfigured")),
                    "openai_key=" + str(d.get("hearthKeyConfigured")),
                    "model_is_luna56=" + str(d.get("spcNextLifeIntentModelConfigured")=="gpt-5.6-luna"))
          except (OSError, ValueError):
              print("RESEARCH_RUNTIME_BINDINGS: invalid health JSON")
          PY
              echo "::error::Research Worker health is reachable but required secure runtime bindings or model configuration are missing. No provider request attempted."
              exit 1
            fi
            echo "Awaiting safe research health ($attempt/25; HTTP=${status:-network_error})"
            sleep 12
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::Research Worker failed authenticated-config health qualification. No model request attempted."
            exit 1
          fi
          login_status="$(curl --silent --show-error --max-time 10 --output /dev/null --write-out '%{http_code}' "$base/api/operator/login")"
          if [ "$login_status" != "200" ]; then
            echo "::error::Operator login view not available; HTTP=$login_status"
            exit 1
          fi
          # No cookie, no bearer, deliberately INVALID body. MUST return 403
          # before reaching model/context validator, even when key is configured.
          denied_status="$(curl --silent --show-error --max-time 10 --output /tmp/spc-research-denial.json --write-out '%{http_code}' --request POST --header 'content-type: application/json' --data '{}' "$base/api/spc-next/life-intent")"
          if [ "$denied_status" != "403" ]; then
            echo "::error::Research Worker did not deny anonymous provider route; HTTP=$denied_status"
            exit 1
          fi
          python3 - /tmp/spc-research-denial.json <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          assert data.get("code") == "research_operator_access_required", "Unexpected denial shape"
          PY
          echo "PASS: read-only health and login; unauthenticated paid route DENIED before provider. Zero Luna calls."

      - name: Publish independent safe-smoke outcome as GitHub commit status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$RESULT" = "success" ]; then state=success; else state=failure; fi
          jq -n --arg state "$state" --arg desc "Cloudflare health and anonymous POST denial ($RESULT); 0 model calls" \
            '{state:$state,context:"spc-research-remote-health",description:$desc}' >/tmp/spc-commit-status.json
          curl --fail --silent --show-error --max-time 12 \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data @/tmp/spc-commit-status.json \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" >/dev/null
          echo "Published spc-research-remote-health: $state"
