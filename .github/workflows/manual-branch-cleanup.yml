name: Manual branch cleanup 2026-09-11

on:
  push:
    branches:
      - maintenance/manual-cleanup-2026-09-11

permissions:
  contents: write

env:
  KEEP_MAIN: main
  KEEP_RECOVERY: recovery/owner-fail-2026-09-07
  KEEP_LIVING: integration/first-presence-browser-live-probe
  HELPER: maintenance/manual-cleanup-2026-09-11
  ARCHIVE: archive/repository-cleanup-2026-09-11
  EXPECT_MAIN: f207419ee87c03979544d2d579e624f043300bbc
  EXPECT_RECOVERY: 883bb1d39d0244f64c950770858c82cf60b34e72
  EXPECT_LIVING: 3f45138ba37a72a5b96ba33902c786a4ce861918

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify, preserve, and atomically retire stale heads
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "first-hearth-cleanup-bot"
          git config user.email "actions@users.noreply.github.com"

          echo "== Fresh remote inventory =="
          mapfile -t remote_rows < <(git ls-remote --heads origin | sort -k2)
          echo "heads=${#remote_rows[@]}"

          declare -A tips
          for row in "${remote_rows[@]}"; do
            sha="${row%%$'\t'*}"
            ref="${row#*$'\t'}"
            name="${ref#refs/heads/}"
            tips["$name"]="$sha"
          done

          [[ "${tips[$KEEP_MAIN]:-}" == "$EXPECT_MAIN" ]] || { echo "main drifted"; exit 21; }
          [[ "${tips[$KEEP_RECOVERY]:-}" == "$EXPECT_RECOVERY" ]] || { echo "recovery drifted"; exit 22; }
          [[ "${tips[$KEEP_LIVING]:-}" == "$EXPECT_LIVING" ]] || { echo "living/PR119 drifted"; exit 23; }
          [[ "${tips[$HELPER]:-}" == "$GITHUB_SHA" ]] || { echo "helper SHA mismatch"; exit 24; }
          [[ -z "${tips[$ARCHIVE]:-}" ]] || { echo "archive branch already exists; refusing ambiguous rerun"; exit 25; }

          stale_names=()
          stale_shas=()
          for name in "${!tips[@]}"; do
            case "$name" in
              "$KEEP_MAIN"|"$KEEP_RECOVERY"|"$KEEP_LIVING"|"$HELPER"|"$ARCHIVE") ;;
              *) stale_names+=("$name"); stale_shas+=("${tips[$name]}") ;;
            esac
          done

          if [[ "${#stale_names[@]}" -ne 129 ]]; then
            echo "Expected exactly 129 retirement candidates, got ${#stale_names[@]}"
            printf '%s\n' "${stale_names[@]}" | sort
            exit 26
          fi

          echo "== Freeze exact branch -> SHA manifest =="
          manifest=.cleanup/recovery-manifest.tsv
          mkdir -p .cleanup
          : > "$manifest"
          for i in "${!stale_names[@]}"; do
            printf '%s\t%s\n' "${stale_shas[$i]}" "${stale_names[$i]}" >> "$manifest"
          done
          sort -k2 "$manifest" -o "$manifest"
          printf '%s\t%s\n' "$EXPECT_MAIN" "$KEEP_MAIN [KEEP]" >> "$manifest"
          printf '%s\t%s\n' "$EXPECT_RECOVERY" "$KEEP_RECOVERY [KEEP]" >> "$manifest"
          printf '%s\t%s\n' "$EXPECT_LIVING" "$KEEP_LIVING [KEEP]" >> "$manifest"

          echo "== Build aggregate archive commit =="
          git add "$manifest"
          tree_sha="$(git write-tree)"

          declare -A seen_parent
          parent_args=(-p "$EXPECT_MAIN")
          seen_parent["$EXPECT_MAIN"]=1
          while IFS=$'\t' read -r sha name; do
            [[ -n "$sha" ]] || continue
            if [[ -z "${seen_parent[$sha]:-}" ]]; then
              parent_args+=(-p "$sha")
              seen_parent["$sha"]=1
            fi
          done < <(head -n 129 "$manifest")

          archive_sha="$(printf '%s\n' \
            'First Hearth repository cleanup archive' \
            '' \
            'Preserves exact pre-cleanup branch tips as commit parents.' \
            'Generated by the one-shot manual cleanup workflow on 2026-09-11.' \
            | git commit-tree "$tree_sha" "${parent_args[@]}")"

          echo "archive_sha=$archive_sha"
          git push origin "$archive_sha:refs/heads/$ARCHIVE"

          remote_archive="$(git ls-remote --heads origin "refs/heads/$ARCHIVE" | awk '{print $1}')"
          [[ "$remote_archive" == "$archive_sha" ]] || { echo "archive publication mismatch"; exit 27; }

          echo "== Verify all retirement tips are ancestors of archive =="
          git fetch --no-tags origin "refs/heads/$ARCHIVE:refs/remotes/origin/$ARCHIVE"
          while IFS=$'\t' read -r sha name; do
            git merge-base --is-ancestor "$sha" "$archive_sha" || {
              echo "Archive does not preserve $name $sha"
              exit 28
            }
          done < <(head -n 129 "$manifest")

          echo "== Fresh CAS check immediately before delete =="
          mapfile -t fresh_rows < <(git ls-remote --heads origin | sort -k2)
          declare -A fresh
          for row in "${fresh_rows[@]}"; do
            sha="${row%%$'\t'*}"
            ref="${row#*$'\t'}"
            fresh["${ref#refs/heads/}"]="$sha"
          done
          [[ "${fresh[$KEEP_MAIN]:-}" == "$EXPECT_MAIN" ]]
          [[ "${fresh[$KEEP_RECOVERY]:-}" == "$EXPECT_RECOVERY" ]]
          [[ "${fresh[$KEEP_LIVING]:-}" == "$EXPECT_LIVING" ]]
          [[ "${fresh[$HELPER]:-}" == "$GITHUB_SHA" ]]
          [[ "${fresh[$ARCHIVE]:-}" == "$archive_sha" ]]

          lease_args=()
          delete_specs=()
          while IFS=$'\t' read -r sha name; do
            [[ "${fresh[$name]:-}" == "$sha" ]] || {
              echo "Target drifted before deletion: $name expected=$sha actual=${fresh[$name]:-ABSENT}"
              exit 29
            }
            lease_args+=("--force-with-lease=refs/heads/$name:$sha")
            delete_specs+=(":refs/heads/$name")
          done < <(head -n 129 "$manifest")

          lease_args+=("--force-with-lease=refs/heads/$HELPER:$GITHUB_SHA")
          delete_specs+=(":refs/heads/$HELPER")

          echo "== Atomic delete of 129 stale heads + helper =="
          git push --atomic "${lease_args[@]}" origin "${delete_specs[@]}"

          echo "== Terminal verification =="
          mapfile -t terminal_rows < <(git ls-remote --heads origin | sort -k2)
          printf '%s\n' "${terminal_rows[@]}"
          [[ "${#terminal_rows[@]}" -eq 4 ]] || { echo "Expected 4 terminal heads"; exit 30; }

          declare -A terminal
          for row in "${terminal_rows[@]}"; do
            sha="${row%%$'\t'*}"
            ref="${row#*$'\t'}"
            terminal["${ref#refs/heads/}"]="$sha"
          done
          [[ "${terminal[$KEEP_MAIN]:-}" == "$EXPECT_MAIN" ]]
          [[ "${terminal[$KEEP_RECOVERY]:-}" == "$EXPECT_RECOVERY" ]]
          [[ "${terminal[$KEEP_LIVING]:-}" == "$EXPECT_LIVING" ]]
          [[ "${terminal[$ARCHIVE]:-}" == "$archive_sha" ]]

          echo "CLEANUP_SUCCESS archive=$archive_sha terminal_heads=4"
