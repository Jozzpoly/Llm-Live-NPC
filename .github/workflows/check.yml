name: Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck, domain tests, and Vite build
        run: npm run check

      - name: Verify self-contained preview upload path
        run: npm run deploy:preview -- --dry-run

      - name: Live E1 fetch then wait probe against exact qualified preview
        if: github.head_ref == 'evidence/e1-live-cognition-probe'
        env:
          E1_PREVIEW_URL: https://8bcdd04a-llm-live-npc.jozzpoly.workers.dev
        shell: bash
        run: |
          first="$(curl --fail-with-body --silent --show-error \
            -X POST "$E1_PREVIEW_URL/api/agent/e1/decide" \
            -H 'content-type: application/json' \
            --data-raw '{"cycleId":1,"trigger":"perception_changed","perception":{"tick":100,"observer":{"id":"npc.001","label":"NPC-001","locationId":"yard","locationLabel":"Common Yard","heldItemId":null},"visibleEntities":[{"id":"player.jozz","kind":"player","label":"Jozz","distance":80,"direction":{"x":-1,"y":0},"heldItemId":null},{"id":"item.mug","kind":"item","label":"Red mug","distance":41,"direction":{"x":-1,"y":0},"heldBy":null}],"fetchableItemIds":["item.mug"]},"observedChanges":[{"kind":"item_holder_changed","itemId":"item.mug","previousHolderId":"player.jozz","holderId":null}],"previousExperience":null}')"
          echo "E1 cycle 1 response: $first"
          FIRST="$first" node - <<'NODE'
          const response = JSON.parse(process.env.FIRST);
          if (response.ok !== true) throw new Error(`Cycle 1 failed: ${process.env.FIRST}`);
          if (response.decision?.kind !== "fetch" || response.decision?.targetId !== "item.mug") {
            throw new Error(`Expected fetch(item.mug), received: ${process.env.FIRST}`);
          }
          if (response.model !== "@cf/ibm-granite/granite-4.0-h-micro") {
            throw new Error(`Unexpected model: ${response.model}`);
          }
          if (!response.gatewayLogId) throw new Error(`Missing Gateway provenance: ${process.env.FIRST}`);
          NODE

          second="$(curl --fail-with-body --silent --show-error \
            -X POST "$E1_PREVIEW_URL/api/agent/e1/decide" \
            -H 'content-type: application/json' \
            --data-raw '{"cycleId":2,"trigger":"perception_and_experience_changed","perception":{"tick":101,"observer":{"id":"npc.001","label":"NPC-001","locationId":"yard","locationLabel":"Common Yard","heldItemId":"item.mug"},"visibleEntities":[{"id":"player.jozz","kind":"player","label":"Jozz","distance":80,"direction":{"x":-1,"y":0},"heldItemId":null},{"id":"item.mug","kind":"item","label":"Red mug","distance":26,"direction":{"x":0,"y":-1},"heldBy":"npc.001"}],"fetchableItemIds":[]},"observedChanges":[{"kind":"observer_held_item_changed","previousItemId":null,"itemId":"item.mug"},{"kind":"item_holder_changed","itemId":"item.mug","previousHolderId":null,"holderId":"npc.001"}],"previousExperience":{"tick":101,"status":"succeeded","code":"picked_up_item","targetId":"item.mug","message":"Picked up Red mug."}}')"
          echo "E1 cycle 2 response: $second"
          SECOND="$second" node - <<'NODE'
          const response = JSON.parse(process.env.SECOND);
          if (response.ok !== true) throw new Error(`Cycle 2 failed: ${process.env.SECOND}`);
          if (response.decision?.kind !== "wait") {
            throw new Error(`Expected wait after successful experience, received: ${process.env.SECOND}`);
          }
          if (response.model !== "@cf/ibm-granite/granite-4.0-h-micro") {
            throw new Error(`Unexpected model: ${response.model}`);
          }
          if (!response.gatewayLogId) throw new Error(`Missing Gateway provenance: ${process.env.SECOND}`);
          NODE
