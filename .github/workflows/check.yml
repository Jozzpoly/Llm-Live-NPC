name: Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install pinned bootstrap dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Typecheck and Wrangler dry run
        run: npm run check
