name: Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install P1 dependencies and generate lockfile
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Typecheck, domain tests, and Vite build
        run: npm run check

      - name: Export generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: p1-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
