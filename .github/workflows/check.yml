name: Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck, domain tests, and Vite build
        run: npm run check

      - name: Verify self-contained preview upload path
        run: npm run deploy:preview -- --dry-run

      - name: Inspect raw Granite two-tool completion
        if: github.head_ref == 'evidence/e1-live-cognition-probe'
        env:
          E1_EVIDENCE_PREVIEW_URL: https://386a0678-llm-live-npc.jozzpoly.workers.dev
        shell: bash
        run: |
          response="$(curl --fail-with-body --silent --show-error \
            -X POST "$E1_EVIDENCE_PREVIEW_URL/api/agent/e1/schema-probe")"
          echo "E1 raw two-tool response: $response"
          RESPONSE="$response" node - <<'NODE'
          const response = JSON.parse(process.env.RESPONSE);
          if (response.ok !== true) throw new Error(`Two-tool diagnostic failed: ${process.env.RESPONSE}`);
          if (!response.gatewayLogId) throw new Error(`Missing Gateway provenance: ${process.env.RESPONSE}`);
          if (!response.result) throw new Error(`Missing raw Granite result: ${process.env.RESPONSE}`);
          NODE
