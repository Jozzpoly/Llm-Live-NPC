name: Live Provider Evidence

on:
  push:
    branches:
      - refoundation/spc-next-five-resident-world
      - research/i2-mira-live-cognition-bridge
    paths:
      - "evidence/live-provider-request.json"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  checks: read

jobs:
  spc-live-provider-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout exact request commit
        uses: actions/checkout@v6

      - name: Use Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Resolve requested qualifiers
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' >> "$GITHUB_ENV"
          const request = require('./evidence/live-provider-request.json');
          const qualifiers = Array.isArray(request.qualifiers)
            ? request.qualifiers
            : ['lifecycle', 'interruption'];
          const allowed = new Set(['lifecycle', 'interruption', 'life-choice']);
          if (qualifiers.length === 0 || qualifiers.some((value) => !allowed.has(value))) {
            throw new Error(`invalid live-provider qualifiers: ${JSON.stringify(qualifiers)}`);
          }
          process.stdout.write(`RUN_LIFECYCLE=${qualifiers.includes('lifecycle') ? '1' : '0'}\n`);
          process.stdout.write(`RUN_INTERRUPTION=${qualifiers.includes('interruption') ? '1' : '0'}\n`);
          process.stdout.write(`RUN_LIFE_CHOICE=${qualifiers.includes('life-choice') ? '1' : '0'}\n`);
          process.stdout.write(`REQUESTED_QUALIFIERS=${qualifiers.join(',')}\n`);
          NODE

      - name: Locate runner Chrome
        if: env.RUN_LIFECYCLE == '1' || env.RUN_INTERRUPTION == '1'
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version

      - name: Resolve exact Cloudflare commit preview
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PR_NUMBER="$(node -e 'const r=require("./evidence/live-provider-request.json"); if(!Number.isInteger(r.pr)||r.pr<1) process.exit(2); process.stdout.write(String(r.pr))')"
          TARGET_SHORT_SHA="${GITHUB_SHA:0:8}"
          export TARGET_SHORT_SHA
          echo "Waiting for Cloudflare preview bound to ${GITHUB_SHA} (PR #${PR_NUMBER})"
          echo "Requested qualifiers: ${REQUESTED_QUALIFIERS}"

          CANDIDATE_URL=""
          RESOLVED_FROM=""
          for attempt in $(seq 1 72); do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
              > /tmp/commit-check-runs.json

            CANDIDATE_URL="$(node <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/commit-check-runs.json', 'utf8'));
          const exactSha = process.env.GITHUB_SHA;
          for (const run of payload.check_runs ?? []) {
            if (run?.head_sha !== exactSha) continue;
            if (run?.app?.slug !== 'cloudflare-workers-and-pages') continue;
            if (run?.name !== 'Workers Builds: llm-live-npc') continue;
            if (run?.status !== 'completed' || run?.conclusion !== 'success') continue;
            const summary = String(run?.output?.summary ?? '');
            const match = summary.match(/Preview URL:\s*(https:\/\/[^\s]+\.workers\.dev)/u);
            if (match) {
              process.stdout.write(match[1]);
              break;
            }
          }
          NODE
            )"
            if [ -n "$CANDIDATE_URL" ]; then
              RESOLVED_FROM="exact Cloudflare check-run"
              break
            fi

            # Historical fallback: the Cloudflare PR comment can lag the authoritative
            # exact-commit check-run, but remains useful for older deployments.
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
              > /tmp/pr-comments.json

            CANDIDATE_URL="$(node <<'NODE'
          const fs = require('fs');
          const comments = JSON.parse(fs.readFileSync('/tmp/pr-comments.json', 'utf8'));
          const short = process.env.TARGET_SHORT_SHA;
          for (const comment of [...comments].reverse()) {
            if (comment?.user?.login !== 'cloudflare-workers-and-pages[bot]') continue;
            const body = String(comment.body ?? '');
            if (!body.includes(short)) continue;
            const match = body.match(/href='(https:\/\/[^']+\.workers\.dev)'>Commit Preview URL<\/a>/u);
            if (match) {
              process.stdout.write(match[1]);
              break;
            }
          }
          NODE
            )"
            if [ -n "$CANDIDATE_URL" ]; then
              RESOLVED_FROM="Cloudflare PR comment fallback"
              break
            fi
            sleep 5
          done

          if [ -z "$CANDIDATE_URL" ]; then
            echo "Cloudflare did not publish an exact-commit preview for ${GITHUB_SHA}" >&2
            cat /tmp/commit-check-runs.json >&2 || true
            cat /tmp/pr-comments.json >&2 || true
            exit 1
          fi

          echo "LIVE_PROVIDER_BASE_URL=$CANDIDATE_URL" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          printf '%s\n' "$CANDIDATE_URL" > /tmp/live-provider-candidate-url.txt
          echo "Exact candidate: $CANDIDATE_URL (${RESOLVED_FROM})"

      - name: Wait for exact candidate to serve the SPC client
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 80); do
            if curl --fail --silent --show-error "${LIVE_PROVIDER_BASE_URL}/?spc=1" > /tmp/live-provider-candidate.html; then
              if grep -q '<div id="game"' /tmp/live-provider-candidate.html; then
                exit 0
              fi
            fi
            sleep 2
          done
          echo "Exact Cloudflare candidate never became ready" >&2
          cat /tmp/live-provider-candidate.html >&2 || true
          exit 1

      - name: Preflight exact browser boundary without provider spend
        if: env.RUN_LIFECYCLE == '1' || env.RUN_INTERRUPTION == '1'
        env:
          LIVE_PROVIDER_PREFLIGHT_OUTPUT: evidence/live-provider/preflight.json
        run: node scripts/spc-browser-live-provider-preflight.mjs

      - name: Qualify real Luna continuing material lifecycle
        if: env.RUN_LIFECYCLE == '1'
        env:
          LIVE_PROVIDER_OUTPUT: evidence/live-provider/live-provider-lifecycle.json
        run: node scripts/spc-browser-live-provider-evidence.mjs

      - name: Qualify real Luna search interruption and exact return
        if: env.RUN_INTERRUPTION == '1'
        env:
          LIVE_PROVIDER_OUTPUT: evidence/live-provider/live-provider-interruption.json
        run: node scripts/spc-browser-live-provider-interruption-evidence-v3.mjs

      - name: Qualify real Luna resident life choice contract
        if: env.RUN_LIFE_CHOICE == '1'
        env:
          LIVE_PROVIDER_OUTPUT: evidence/live-provider/live-provider-life-choice.json
        run: node scripts/spc-live-provider-life-choice-evidence.mjs

      - name: Print live-provider evidence summary
        if: always()
        shell: bash
        run: |
          echo "--- Candidate ---"
          cat /tmp/live-provider-candidate-url.txt 2>/dev/null || true
          echo "--- Requested qualifiers ---"
          echo "${REQUESTED_QUALIFIERS:-unresolved}"
          echo "--- Spend-free browser preflight ---"
          if [ "${RUN_LIFECYCLE:-0}" = "1" ] || [ "${RUN_INTERRUPTION:-0}" = "1" ]; then
            cat evidence/live-provider/preflight.json 2>/dev/null || true
          else
            echo "not requested in this run"
          fi
          echo "--- Two-burst material lifecycle ---"
          if [ "${RUN_LIFECYCLE:-0}" = "1" ]; then
            cat evidence/live-provider/live-provider-lifecycle.json 2>/dev/null || true
          else
            echo "not requested in this run"
          fi
          echo "--- Live provider interruption evidence ---"
          if [ "${RUN_INTERRUPTION:-0}" = "1" ]; then
            cat evidence/live-provider/live-provider-interruption.json 2>/dev/null || true
          else
            echo "not requested in this run"
          fi
          echo "--- Resident life choice provider evidence ---"
          if [ "${RUN_LIFE_CHOICE:-0}" = "1" ]; then
            cat evidence/live-provider/live-provider-life-choice.json 2>/dev/null || true
          else
            echo "not requested in this run"
          fi

      - name: Upload live-provider evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spc-live-provider-evidence-${{ github.sha }}
          path: evidence/live-provider
          if-no-files-found: error
          retention-days: 30
