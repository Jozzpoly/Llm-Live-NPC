name: Repository Cleanup v5 remote prepare

on:
  push:
    branches:
      - "maintenance/repository-cleanup-v5-prepare-fa1ab57d197a961321"

permissions:
  contents: write
  actions: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Native v5 prepare
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CLEANUP_CONFIG_B64: ''
          CLEANUP_DECISIONS_B64: ''
          CLEANUP_REPOSITORY_ID: ${{ github.repository_id }}
          CLEANUP_EXPECT_CANONICAL: 'f207419ee87c03979544d2d579e624f043300bbc'
          CLEANUP_HELPER_REF: 'refs/heads/maintenance/repository-cleanup-v5-prepare-fa1ab57d197a961321'
          CLEANUP_ARCHIVE_REF: 'refs/heads/archive/repository-cleanup-v5-recovery-2026-09-12'
        run: |
          set -euo pipefail
          mkdir -p /tmp/cleanup-kit /tmp/cleanup-out
          cat .cleanup-bootstrap/runtime.zip.b64.part-* | base64 -d > /tmp/cleanup-kit.zip
          [[ "$(sha256sum /tmp/cleanup-kit.zip | awk '{print $1}')" == "c636bd765ae402a27e0669152a07a65accb018e9cb35abc53d959f140ccaebf5" ]] || { echo runtime-digest-mismatch; exit 19; }
          unzip -q /tmp/cleanup-kit.zip -d /tmp/cleanup-kit
          printf '%s' "$CLEANUP_CONFIG_B64" | base64 -d > /tmp/cleanup-out/config.json
          printf '%s' "$CLEANUP_DECISIONS_B64" | base64 -d > /tmp/cleanup-out/decisions.json
          cli=/tmp/cleanup-kit/src/cli.mjs
          [[ "$(git ls-remote origin refs/heads/main | awk '{print $1}')" == "$CLEANUP_EXPECT_CANONICAL" ]] || { echo canonical-drift; exit 20; }
          node "$cli" audit --repo="$GITHUB_WORKSPACE" --config=/tmp/cleanup-out/config.json --out=/tmp/cleanup-out/audit.json
          node "$cli" freeze --repo="$GITHUB_WORKSPACE" --config=/tmp/cleanup-out/config.json --audit=/tmp/cleanup-out/audit.json --decisions=/tmp/cleanup-out/decisions.json --out=/tmp/cleanup-out/freeze.json
          node "$cli" archive --repo="$GITHUB_WORKSPACE" --config=/tmp/cleanup-out/config.json --freeze=/tmp/cleanup-out/freeze.json --out=/tmp/cleanup-out/archive.json
          node "$cli" rehearse --repo="$GITHUB_WORKSPACE" --config=/tmp/cleanup-out/config.json --freeze=/tmp/cleanup-out/freeze.json --archive=/tmp/cleanup-out/archive.json --out=/tmp/cleanup-out/rehearsal-dir --result-out=/tmp/cleanup-out/rehearsal.json
          node "$cli" preservation --repo="$GITHUB_WORKSPACE" --config=/tmp/cleanup-out/config.json --archive=/tmp/cleanup-out/archive.json --rehearsal=/tmp/cleanup-out/rehearsal.json --repository-id="$CLEANUP_REPOSITORY_ID" --out=/tmp/cleanup-out/preservation-v1.json
          node "$cli" preservation-v2 --repo="$GITHUB_WORKSPACE" --config=/tmp/cleanup-out/config.json --preservation=/tmp/cleanup-out/preservation-v1.json --root-ref="$CLEANUP_ARCHIVE_REF" --out=/tmp/cleanup-out/preservation-v2.json
          node "$cli" publish-archive --repo="$GITHUB_WORKSPACE" --config=/tmp/cleanup-out/config.json --freeze=/tmp/cleanup-out/freeze.json --archive=/tmp/cleanup-out/archive.json --execute
          archive_sha="$(node -e "console.log(require('/tmp/cleanup-out/archive.json').archiveSha)")"
          [[ "$(git ls-remote origin "$CLEANUP_ARCHIVE_REF" | awk '{print $1}')" == "$archive_sha" ]] || { echo archive-publication-mismatch; exit 21; }
          cp /tmp/cleanup-out/freeze.json /tmp/cleanup-out/OWNER_AUTHORITY_INPUT_FREEZE.json
          echo PASS_NATIVE_REMOTE_PREPARE
      - name: Upload native prepare evidence
        uses: actions/upload-artifact@v4
        with:
          name: repository-cleanup-v5-prepare-fa1ab57d197a961321
          path: /tmp/cleanup-out
          if-no-files-found: error
          retention-days: 7
      - name: Self-retire prepare helper
        shell: bash
        run: |
          set -euo pipefail
          helper_sha="$(git ls-remote origin "$CLEANUP_HELPER_REF" | awk '{print $1}')"
          [[ -n "$helper_sha" ]] || exit 22
          git push --atomic --force-with-lease=refs/heads/main:"$CLEANUP_EXPECT_CANONICAL" --force-with-lease="$CLEANUP_HELPER_REF:$helper_sha" origin "$CLEANUP_EXPECT_CANONICAL:refs/heads/main" ":$CLEANUP_HELPER_REF"
          echo PASS_NATIVE_REMOTE_PREPARE_AND_SELF_RETIRE
