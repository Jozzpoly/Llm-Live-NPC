name: ROBS Trusted Player Loop

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/spc-browser-trusted-player-loop.mjs"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/robs-trusted-player-loop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trusted-player-loop:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build browser candidate
        run: npm run build

      - name: Locate runner Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version

      - name: Start static built-client server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist/client > /tmp/spc-static.log 2>&1 &
          for attempt in $(seq 1 80); do
            if curl --fail --silent --show-error 'http://127.0.0.1:4173/?spc=1' > /dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/spc-static.log
          exit 1

      - name: Probe trusted participant input through factual World and private resident perception
        shell: bash
        env:
          EVIDENCE_BASE_URL: http://127.0.0.1:4173
          TRUSTED_PLAYER_LOOP_OUTPUT: evidence/browser/trusted-player-loop.json
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "trusted-player probe attempt $attempt"
            set +e
            node scripts/spc-browser-trusted-player-loop.mjs
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if jq -e '.outcome == "HARNESS_ERROR" and (.error.message | contains("ENOTEMPTY: directory not empty"))' evidence/browser/trusted-player-loop.json >/dev/null 2>&1; then
              echo "Chrome profile cleanup raced after the probe; retrying the unchanged experiment."
              sleep 1
              continue
            fi
            exit "$status"
          done
          echo "Chrome profile cleanup race persisted across all attempts."
          exit 1

      - name: Print trusted-player causal-loop report
        if: always()
        run: cat evidence/browser/trusted-player-loop.json 2>/dev/null || true

      - name: Upload trusted-player evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spc-trusted-player-loop-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/browser
          if-no-files-found: error
          retention-days: 14
