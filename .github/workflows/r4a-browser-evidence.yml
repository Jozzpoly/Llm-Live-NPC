name: R4a Browser Evidence

on:
  pull_request:

jobs:
  r4a-browser-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked project dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install temporary Playwright evidence dependency
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build and run rendered R4a evidence
        env:
          BASE_URL: http://127.0.0.1:4173
        run: |
          npm run build
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist/client > /tmp/llm-live-npc-r4a-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT

          READY=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/llm-live-npc-r4a-http.log
            exit 1
          fi

          npx playwright test tests/r4a-browser-evidence.spec.ts --reporter=line --workers=1
