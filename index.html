<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>LLM Live NPC — E1 Laboratory</title>
  </head>
  <body>
    <main id="app">
      <section class="game-shell">
        <header>
          <div>
            <p class="eyebrow">E1 grounded-agent laboratory</p>
            <h1>LLM Live NPC</h1>
          </div>
          <div id="e1-stage-chip" class="stage-chip">E1 cognition disarmed</div>
        </header>
        <div id="game" aria-label="Playable top-down world"></div>
        <footer>
          <span>Move: WASD / arrows / touch joystick</span>
          <span>Interact / pick up: E / Interact</span>
          <span>Drop held item: Q / Drop</span>
          <span>Zoom: mouse wheel / two-finger pinch</span>
          <span>Debug controls: workspace / V / L</span>
        </footer>
      </section>
      <aside id="debug" class="debug-shell" aria-label="Debug workspace"></aside>
    </main>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
